[package]
name = "zc-bench"
version = "0.1.0"
edition = "2021"
description = "Linux/Rust zero-copy raw video transfer benchmark"

[dependencies]
libc = "0.2"
zerocopy = { version = "0.8", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true          # perf 심볼 확보용
